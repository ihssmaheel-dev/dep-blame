name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20.x', '22.x']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Pack and smoke-test tarballs
        shell: bash
        run: |
          mkdir -p dist-pack
          npm pack --workspace packages/core --pack-destination ./dist-pack
          npm pack --workspace packages/ui --pack-destination ./dist-pack
          smoke=$(mktemp -d)
          npm install --prefix "$smoke" --ignore-scripts "$PWD"/dist-pack/*.tgz
          node test/pack-smoke.js "$smoke"

  json-fallback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - run: npm ci --omit=optional
      - run: npm test
