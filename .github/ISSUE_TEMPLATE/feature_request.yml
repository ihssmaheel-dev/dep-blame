name: Feature request
description: Propose an idea within the history-analysis scope
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: The investigation or workflow that is painful today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should happen? Which command, flag, endpoint, or view?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope fit
      description: How does this reuse the history/query model (no registry monitoring or auto-changes)?
      placeholder: e.g. new filter over DependencyEvent[], bounded server query, …
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
